<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taskmaster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container m-3">
    <h1>Taskmaster</h1>

    <div class="col-md-4">
        <label for="task" class="form-label"></label>

        <div class="input-group">
            <input type="text" class="form-control" id="task" placeholder="Enter your task...">
            <button id="add-btn" class="btn btn-primary">Add Task</button>
        </div>
    </div>

    <ul id="task-list" class="list-unstyled mt-2"></ul>
    <script src="client.js"></script>
</body>
</html>
